<div class="content">
  <div class="container-fluid">
    <form class="common-form col-12 needs-validation" novalidate>

      <div class="form-group">
        <input type="text" class="form-control rounded-3" id="common-name" placeholder="Тип..." required="">
        <div class="invalid-feedback">Введите название</div>
      </div>
      <div class="form-group">
        <input type="text" class="form-control rounded-3" id="common-category" placeholder="Категория..." required="">
        <div class="invalid-feedback">Введите название</div>
      </div>
      <div class="form-group">
        <input type="text" class="form-control rounded-3" id="common-sum" placeholder="Сумма в $..." required="">
        <div class="invalid-feedback">Введите название</div>
      </div>
      <div class="form-group">
        <input type="date" class="form-control rounded-3" id="common-date" placeholder="Дата..." required="">
        <div class="invalid-feedback">Введите название</div>
      </div>
      <div class="form-group">
        <input type="text" class="form-control rounded-3" id="common-comment" placeholder="Комментарий..." required="">
        <div class="invalid-feedback">Введите название</div>
      </div>

      <div class="mt-3 d-flex gap-3">
        <button type="button" class="btn btn-success" id="common-success">Создать</button>
        <button type="button" class="btn btn-danger" id="common-cancel">Отмена</button>
      </div>
    </form>
  </div>
</div>

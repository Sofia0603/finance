<div class="common">
    <div class="container-fluid">

      <div class="mt-3 d-flex gap-3 mb-5">
        <a href="/common-add?type=income" class="btn btn-success" id="create-income">Создать доход</a>
        <a href="/common-add?type=expense" class="btn btn-danger" id="create-expenses">Создать расход</a>
      </div>

      <div class="dashboard row align-items-center gap-3 mb-5">
        <div class="col-12 col-md-auto">
          <ul class="nav nav-pills dashboard-tab">
            <li class="nav-item">
              <button type="button" class="nav-link" data-period="today">
                Сегодня
              </button>
            </li>
            <li class="nav-item">
              <button type="button" class="nav-link" data-period="week">
                Неделя
              </button>
            </li>
            <li class="nav-item">
              <button type="button" class="nav-link" data-period="month">
                Месяц
              </button>
            </li>
            <li class="nav-item">
              <button type="button" class="nav-link" data-period="year">
                Год
              </button>
            </li>
            <li class="nav-item">
              <button type="button" class="nav-link active" data-period="all">
                Все
              </button>
            </li>
            <li class="nav-item">
              <button type="button" class="nav-link" data-period="interval">
                Интервал
              </button>
            </li>
          </ul>
        </div>
        <div class="col-12 col-md d-flex">
          <form class="d-flex flex-nowrap gap-4">

            <div class="d-flex align-items-center gap-2">
              <label for="input_from" class="mb-0">с</label>
              <input type="text" id="input_from" class="form-control bg-transparent border-0" style="width:110px" placeholder="Дата">
            </div>

            <div class="d-flex align-items-center gap-2">
              <label for="input_to" class="mb-0">по</label>
              <input type="text" id="input_to" class="form-control bg-transparent border-0" style="width:110px" placeholder="Дата">
            </div>


          </form>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table bg-transparent">
        <thead>
        <tr>
          <th scope="col">№ операции</th>
          <th scope="col">Тип</th>
          <th scope="col">Категория</th>
          <th scope="col">Сумма</th>
          <th scope="col">Дата</th>
          <th scope="col">Комментарий</th>
          <th scope="col"></th>
        </tr>
        </thead>

        <tbody id="table-body">

        </tbody>

      </table>
      </div>



    </div>
  </div>


<div class="modal fade" id="common-delete-modal" tabindex="-1" role="dialog" aria-labelledby="common-delete" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-body text-center font-medium fw-bold color-dark-blue fs-5">
        Вы действительно хотите удалить категорию?
      </div>
      <div class="modal-footer d-flex justify-content-center">
        <button type="button" class="btn btn-success" id="common-delete">Да, удалить</button>
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Не удалять</button>
      </div>
    </div>
  </div>
</div>

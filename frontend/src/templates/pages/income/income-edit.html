<div class="content">
  <div class="container-fluid">
    <form class="col-12 needs-validation" novalidate id="income-edit-form">

      <input type="text" class="form-control rounded-3" id="income-name" placeholder="Название..." required="">
      <div class="invalid-feedback">
        Введите название
      </div>

      <div class="mt-3 d-flex gap-3">
        <button type="button" class="btn btn-success" id="income-edit">Сохранить</button>
        <button type="button" class="btn btn-danger" id="income-cancel">Отмена</button>
      </div>
    </form>
  </div>
</div>
